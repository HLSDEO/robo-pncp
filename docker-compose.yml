services:
  pncp-db:
    image: postgres:16-alpine
    container_name: robo-pncp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pncp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pncp}
      POSTGRES_DB: ${POSTGRES_DB:-pncp}
    ports:
      - "${POSTGRES_PORT:-5442}:5442"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pncp} -d ${POSTGRES_DB:-pncp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  adminer:
    image: adminer:latest
    container_name: robo-pncp-adminer
    restart: unless-stopped
    depends_on:
      pncp-db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: pncp-db
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - default

  collector:
    build: .
    container_name: robo-pncp-collector
    depends_on:
      pncp-db:
        condition: service_healthy
    environment:
      DB_HOST: pncp-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-pncp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pncp}
      DB_NAME: ${POSTGRES_DB:-pncp}
      RUN_MODE: ${RUN_MODE:-loop}
      LOOP_INTERVAL_SECONDS: ${LOOP_INTERVAL_SECONDS:-21600}
      PAGE_SIZE: ${PAGE_SIZE:-50}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-60}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: ${WORKERS:-4}
      HTTP_RETRIES: ${HTTP_RETRIES:-6}
      HTTP_BACKOFF_MAX: ${HTTP_BACKOFF_MAX:-60}
      HTTP_MAX_CONNECTIONS: ${HTTP_MAX_CONNECTIONS:-10}
      HTTP_MAX_KEEPALIVE: ${HTTP_MAX_KEEPALIVE:-5}
      HTTP_KEEPALIVE_EXPIRY: ${HTTP_KEEPALIVE_EXPIRY:-5}
      DA_PAGE_SIZE: ${DA_PAGE_SIZE:-500}
      ARP_ANO_INICIAL: ${ARP_ANO_INICIAL:-2023}
      # ----- Observabilidade -----
      OBS_ENABLED: ${OBS_ENABLED:-true}
      OBS_URL: ${OBS_URL:-http://backend:8000/api/logs}
      OBS_SOURCE: ${OBS_SOURCE:-robo-pncp}
      OBS_ENVIRONMENT: ${OBS_ENVIRONMENT:-prod}
      OBS_TIMEOUT: ${OBS_TIMEOUT:-5}
      OBS_QUEUE_MAX: ${OBS_QUEUE_MAX:-5000}
    networks:
      - default
      - observabilidade

volumes:
  pgdata:

networks:
  default:
  observabilidade:
    name: observabilidade_network
    external: true
